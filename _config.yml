title: Aravinthen's Research Notes
description: Mastering post-training, with a focus on multi-agent methods for alignment and scalable oversight
author: Aravinthen Rajkumar
theme: null

markdown: kramdown
highlighter: rouge

permalink: /:year/:month/:day/:title/

collections:
  log:
    output: true
    permalink: /log/:year-:month-:day/

exclude:
  - README.md
  - reports
  - tests
  - MAINTENANCE.md
  - Makefile
  - Gemfile
  - Gemfile.lock

url: "https://aravinthen.github.io"
baseurl: ""
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
