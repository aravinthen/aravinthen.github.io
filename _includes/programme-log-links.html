{% assign log_project_id = include.id %}
{% if site.data.research_projects[log_project_id] %}
  {% assign programme_logs = site.log | where_exp: 'entry', 'entry.projects contains log_project_id' %}
  {% if programme_logs.size > 0 %}
  <p class="programme-links">
    <a href="{{ '/log/' | relative_url }}?project={{ log_project_id | url_encode }}">Research logs</a>
    · <a href="{{ '/log/timelines/' | relative_url }}#project-{{ log_project_id }}">Project timeline</a>
  </p>
  {% endif %}
{% endif %}
